dashboard:
  title: brainboxemb GitHub Actions Dashboard
  subtitle: Current workflow status on the default branch
  owner: brainboxemb
  repository: brainboxemb.dashboard
  refresh_workflow: deploy-dashboard.yml
  settings_workflow: configure-repositories.yml
  # Repository settings changes use DASHBOARD_ADMIN_TOKEN.
  hide_repositories_without_workflows: false
  separate_repositories_without_workflows: true
  repositories_without_workflows_group: Repositories without Actions
  show_disabled_workflows: false
  hide_reusable_only_workflows: true
  show_latest_tag: true
  show_open_pull_requests: true
  show_branch_cleanup: true
  branch_cleanup_ignore_branches:
    - build
    - verification
    - dev/build
    - dev/verification
    - prod/build
    - prod/verification
    - rel/*
    - gh-pages
  show_branch_auto_delete: true
  show_default_branch_protection: true
  action_metrics_days: 30
  stale_after_hours: 168

groups:
  - name: Tooling
    repositories:
      - brainboxemb.github.actions
      - docker.scad-toolchain
      - docker.scad-toolchain.test
      - template.scad-project
      - tool.scad-project
      - tool.java-project
      - tool.git-project
      - tool.eng-docs
      - tech.scad
      - meta.scad-projects

  - name: CAD libraries
    repositories:
      - lib.scad.clamps
      - lib.scad.hub75

  - name: CAD projects
    repositories:
      - 2026-003-01.cad.garden-tool-cart
      - 2026-004-01.cad.metabo-tsu-slot-insert
      - 2026-005-01.cad.aluminium-profile-mft
      - 2026-006-01.cad.HUB75-display-frame
      - 2026-006-02.cad.HUB75-display-case
      - 2026-007-01.cad.tool-board
      - 2026-008-01.cad.bosch-table
      - 2026-009-01.cad.HUB75-display-frame

  - name: Software projects
    repositories:
      - 2026-010-01.meta.event-timing-software
      - 2026-010-02.java.event-timing-framework

  - name: Sites & experiments
    repositories:
      - site.notes
      - site.hugo-step001
      - brainboxemb.github.io
      - exp.2026-001.marp

workflow_labels:
  pages-build-deployment: Pages
  render-openscad: Render OpenSCAD
  render_openscad_pngs: Render OpenSCAD
  export-openscad-stls: Export STL
  export_openscad_stls: Export STL
  verification: Verification
  verify: Verification
  test: Tests
  tests: Tests
  build: Build
  deploy: Deploy
  release: Release
