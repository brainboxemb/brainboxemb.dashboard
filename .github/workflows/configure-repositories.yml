name: Configure repository settings

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository name, owner/name, or 'all'"
        required: true
        default: "all"
        type: string
      delete_branch_on_merge:
        description: "Automatically delete head branches after PR merge"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    paths:
      - ".github/repository-settings/apply-all-auto-delete"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure repositories
        env:
          DASHBOARD_ADMIN_TOKEN: ${{ secrets.DASHBOARD_ADMIN_TOKEN }}
          TARGET_REPOSITORY: ${{ github.event_name == 'push' && 'all' || inputs.repository }}
          DELETE_BRANCH_ON_MERGE: ${{ github.event_name == 'push' && 'true' || inputs.delete_branch_on_merge }}
        run: >-
          python src/configure_repository_settings.py
          --config dashboard.yml
          --repository "$TARGET_REPOSITORY"
          --delete-branch-on-merge "$DELETE_BRANCH_ON_MERGE"

      - name: Refresh hint
        run: |
          echo "Repository settings updated."
          echo "Run the Deploy dashboard workflow to refresh the displayed status immediately."
