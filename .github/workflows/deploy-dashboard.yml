name: Deploy

# Scheduled runs still collect data; Pages deploys only when the dashboard fingerprint changes.

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"
  push:
    branches: [main]
    paths:
      - "dashboard.yml"
      - "requirements.txt"
      - "src/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      - name: Set up Python
        timeout-minutes: 2
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 2
        run: pip install -r requirements.txt

      - name: Run tests
        timeout-minutes: 2
        run: python -m unittest discover -s tests -v

      - name: Generate dashboard
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          DASHBOARD_ADMIN_TOKEN: ${{ secrets.DASHBOARD_ADMIN_TOKEN }}
        run: >-
          python src/generate_dashboard.py
          --config dashboard.yml
          --output site/index.html
          --hash-output .dashboard-content-hash

      - name: Compare with deployed dashboard
        timeout-minutes: 2
        id: changes
        shell: bash
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail

          new_hash="$(tr -d '\r\n' < .dashboard-content-hash)"
          current_hash="$(
            curl --fail --silent --show-error --location --max-time 20               "${PAGES_URL}?_check=${GITHUB_RUN_ID}" 2>/dev/null               | sed -n 's/.*name="dashboard-content-hash" content="\([^"]*\)".*/\1/p'               | head -n 1               || true
          )"

          echo "Current deployed hash: ${current_hash:-<none>}"
          echo "New dashboard hash    : $new_hash"

          if [[ -n "$current_hash" && "$current_hash" == "$new_hash" ]]; then
            echo "No dashboard-visible changes; skipping GitHub Pages deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dashboard-visible state changed; GitHub Pages will be deployed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        timeout-minutes: 2
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        timeout-minutes: 2
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: needs.build.outputs.changed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        timeout-minutes: 2
        id: deployment
        uses: actions/deploy-pages@v4
